<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ROY</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e24; /* Couleur de fond sombre identique à l'image */
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- CONTENEUR GLOBAL --- */
        .birthday-container {
            text-align: center;
            position: relative;
            z-index: 10;
            cursor: pointer;
        }

        /* --- BOUGIE & FLAMME --- */
        .candle-wrapper {
            position: relative;
            margin-bottom: -5px;
            display: inline-block;
        }
        .wick {
            width: 2px;
            height: 10px;
            background-color: #fff;
            margin: 0 auto;
        }
        .fire {
            width: 10px;
            height: 18px;
            background: radial-gradient(ellipse at bottom, #ffffff 30%, #f1c40f 60%, #e67e22 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.15s infinite alternate;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
            100% { transform: translateX(-50%) scale(1.1) rotate(1deg); }
        }

        /* --- GÂTEAU AU CHOCOLAT --- */
        .cake {
            width: 160px;
            height: 75px;
            background: linear-gradient(to bottom, #795548 40%, #5d4037 40%, #5d4037 60%, #4e342e 60%);
            border-radius: 6px 6px 0 0;
            position: relative;
            margin: 0 auto;
        }
        /* Crème/Glaçage blanc qui coule */
        .frosting {
            width: 166px;
            height: 20px;
            background-color: #fff;
            border-radius: 10px;
            position: absolute;
            top: -5px;
            left: -3px;
        }
        .drip {
            position: absolute;
            background-color: #fff;
            width: 12px;
            height: 18px;
            border-radius: 0 0 10px 10px;
        }
        .drip1 { left: 15px; height: 22px; }
        .drip2 { left: 45px; height: 30px; }
        .drip3 { left: 95px; height: 25px; }
        .drip4 { left: 135px; height: 18px; }

        /* Assiette/Support blanc */
        .plate {
            width: 190px;
            height: 4px;
            background-color: #fff;
            border-radius: 2px;
            margin: 0 auto 25px auto;
        }

        /* --- TEXTE STYLE --- */
        .message-title {
            color: #ffffff;
            font-size: 34px;
            font-weight: 300;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        .message-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: 400;
            margin: 0;
            opacity: 0.7;
        }

        /* État éteint */
        .birthday-container.extinguished .fire {
            display: none !important;
        }

        /* --- PARTICULES / TRAÎNÉE DE LA SOURIS --- */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            animation: fadeOutParticle 0.8s linear forwards;
        }
        @keyframes fadeOutParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }

        /* --- CONFETTIS DE SOUFFLE --- */
        .confetti {
            position: fixed;
            width: 6px;
            height: 6px;
            pointer-events: none;
            animation: scatter 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes scatter {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--cx), var(--cy)) rotate(720deg); opacity: 0; }
        }

        /* --- BALLONS DÉCORATIFS --- */
        .balloon {
            position: absolute;
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            z-index: 5;
            opacity: 0.75;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 22px;
            width: 1px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.3);
        }
        /* Positions et couleurs des ballons de l'image */
        .b1 { background-color: #fbc4c4; top: 42%; left: 55%; animation: floatUp 6s ease-in-out infinite alternate; }
        .b2 { background-color: #aed8f2; top: 68%; left: 76%; animation: floatUp 5s ease-in-out infinite alternate-reverse; }
        .b3 { background-color: #f9f7dc; top: 80%; left: 87%; animation: floatUp 7s ease-in-out infinite alternate; }
        .b4 { background-color: #f9f7dc; top: 80%; left: 87%; animation: floatUp 7s ease-in-out infinite alternate; }
        .b5 { background-color: #f9f7dc; top: 80%; left: 87%; animation: floatUp 7s ease-in-out infinite alternate; }
        .b6 { background-color: #f9f7dc; top: 80%; left: 87%; animation: floatUp 7s ease-in-out infinite alternate; }


        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-2deg); }
            100% { transform: translateY(-15px) rotate(2deg); }
        }
    </style>
</head>
<body>

    <!-- Structure du gâteau et de la bougie -->
    <div class="birthday-container" id="birthdayZone">
        <div class="candle-wrapper">
            <div class="fire"></div>
            <div class="wick"></div>
        </div>
        <div class="cake">
            <div class="frosting">
                <div class="drip drip1"></div>
                <div class="drip drip2"></div>
                <div class="drip drip3"></div>
                <div class="drip drip4"></div>
            </div>
        </div>
        <div class="plate"></div>

        <h1 class="message-title">happy birthday!</h1>
        <p class="message-name">ROY</p>
    </div>

    <!-- Ballons d'arrière-plan -->
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>

    <script>
        // 1. Éteindre la bougie au clic avec explosion de confettis fins
        document.getElementById('birthdayZone').addEventListener('click', function(e) {
            if(!this.classList.contains('extinguished')) {
                this.classList.add('extinguished');
                
                // Position du clic pour l'explosion
                const rect = this.getBoundingClientRect();
                const startX = rect.left + rect.width / 2;
                const startY = rect.top + 20;

                // Création de 120 petits confettis fins comme sur l'image
                for (let i = 0; i < 120; i++) {
                    const p = document.createElement('div');
                    p.classList.add('confetti');
                    p.style.left = startX + 'px';
                    p.style.top = startY + 'px';
                    
                    // Couleurs claires et festives
                    const colors = ['#fff', '#fbc4c4', '#aed8f2', '#f9f7dc'];
                    p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Angle d'explosion tout autour
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 250 + 50;
                    
                    p.style.setProperty('--cx', Math.cos(angle) * distance + 'px');
                    p.style.setProperty('--cy', Math.sin(angle) * distance + 'px');
                    
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 1200);
                }
            }
        });

        // 2. Traînée scintillante magique qui suit le curseur de la souris
        window.addEventListener('mousemove', function(e) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            
            // Légère dispersion de la traînée
            const mx = (Math.random() - 0.5) * 30;
            const my = (Math.random() - 0.5) * 30 + 20; // Tombe légèrement vers le bas
            sparkle.style.setProperty('--mx', mx + 'px');
            sparkle.style.setProperty('--my', my + 'px');
            
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        });
    </script>

</body>
</html>
